name: keepalive

# Keeps the free Render service awake during working hours (08:00-20:00 Tashkent = 03:00-15:00 UTC)
# so the bot and the reception scanner answer instantly. ~12 h/day stays well inside the free 750 h/month.
on:
  schedule:
    - cron: '*/10 3-14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null https://kinder-spa.onrender.com/health
