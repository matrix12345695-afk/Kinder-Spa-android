name: Kinder native Android acceptance
on:
  push:
    paths: ['android/**','ci/android_fixture.py','ci/verify_android.py','backend/**','.github/workflows/kinder-android.yml']
  pull_request:
    paths: ['android/**','ci/android_fixture.py','ci/verify_android.py','backend/**','.github/workflows/kinder-android.yml']
permissions:
  contents: read
jobs:
  native:
    name: Kinder native Android acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:9770878138a2e83abcb10856d30cc3f24dae0d317bb956db6ab9159de6c3c80d
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kinder_test
        ports: ['15439:5432']
        options: >-
          --memory=512m --cpus=1 --pids-limit=96
          --tmpfs /var/lib/postgresql:rw,size=256m
          --health-cmd "pg_isready -U postgres -d kinder_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      KINDER_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:15439/kinder_test
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set reviewed Java version
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Set reviewed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed fixture dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock
      - name: Build real review and fixture APKs and run16 JVM checks
        run: python android/gradle.py :app:assembleReviewDebug :app:assembleFixtureDebug :app:assembleFixtureDebugAndroidTest :app:assembleReviewDebugAndroidTest :app:testReviewDebugUnitTest :app:lintReviewDebug
      - name: Start guarded synthetic API fixture
        run: |
          python ci/android_fixture.py > /tmp/kinder-android-fixture.log 2>&1 &
          echo $! > /tmp/kinder-android-fixture.pid
          python - <<'PY'
          import time,urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18763/health',timeout=1) as r:
                      if r.status==200:break
              except OSError:pass
              time.sleep(.25)
          else:raise SystemExit('synthetic API fixture not ready')
          PY
      - name: Enable hosted KVM for isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kinder-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run10 fixture and1 real review Android device checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 2048
          script: |
            python android/gradle.py :app:connectedFixtureDebugAndroidTest :app:connectedReviewDebugAndroidTest
            mkdir -p android-evidence/screenshots
            adb pull /sdcard/Android/data/uz.kinderspa.client.fixture/files/native-evidence/. android-evidence/screenshots/
            python ci/verify_android.py
      - name: Stop only synthetic API fixture
        if: always()
        run: |
          if test -f /tmp/kinder-android-fixture.pid; then kill -TERM "$(cat /tmp/kinder-android-fixture.pid)" 2>/dev/null || true; fi
      - name: Upload review APK and synthetic native evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinder-android-${{ github.run_attempt }}
          path: android-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Upload synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinder-android-test-diagnostics-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/androidTest-results/**/*.xml
            android/app/build/test-results/**/*.xml
            android/app/build/reports/lint-results-reviewDebug.xml
          if-no-files-found: ignore
          retention-days: 7
