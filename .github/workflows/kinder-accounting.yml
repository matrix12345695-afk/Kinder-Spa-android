name: Kinder PostgreSQL accounting acceptance
on:
  push:
    paths: ['backend/**', '.github/workflows/kinder-accounting.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/kinder-accounting.yml']
permissions:
  contents: read
jobs:
  accounting:
    name: Kinder PostgreSQL accounting acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/kinder-browser-runtime
    services:
      postgres:
        image: postgres@sha256:9770878138a2e83abcb10856d30cc3f24dae0d317bb956db6ab9159de6c3c80d
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kinder_test
        ports: ['15439:5432']
        options: >-
          --memory=512m --cpus=1 --pids-limit=96
          --tmpfs /var/lib/postgresql:rw,size=256m
          --health-cmd "pg_isready -U postgres -d kinder_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed hashed wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock
      - name: Install reviewed browser test wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/browser-requirements.lock
      - name: Install fixed Chromium revision
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run all93 accounting and admin boundary checks
        env:
          KINDER_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:15439/kinder_test
        run: python backend/run_checks.py
      - name: Run all24 real admin browser checks
        env:
          KINDER_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:15439/kinder_test
        run: python backend/run_browser_checks.py
      - name: Upload synthetic accounting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinder-accounting-${{ github.run_attempt }}
          path: |
            accounting-evidence/report.json
            admin-evidence/
          if-no-files-found: error
          retention-days: 30
