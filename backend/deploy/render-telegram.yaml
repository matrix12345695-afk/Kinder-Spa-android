# REVIEW ONLY: creates a PAID Render worker. Requires owner cost/release approval.
# Use this custom Blueprint path, not the unfinished root API scaffold.
# No new DB, disk, cron, web service or VPS deployment is defined.
previews:
  generation: 'off'
services:
  - type: worker
    name: kinder-spa-telegram
    runtime: python
    repo: https://github.com/matrix12345695-afk/Kinder-Spa-android
    branch: feature/render-api-pilot
    rootDir: backend
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 180
    buildCommand: >-
      python -m pip install --require-hashes --only-binary=:all: -r requirements.lock -r telegram-requirements.lock
    startCommand: python -m kinder.telegram_runner --run
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.12'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: KINDER_TELEGRAM_LIVE
        value: disabled
      - key: KINDER_WORKER_MODE
        value: inspection
      # Operator connection is usable ONLY by explicit read-only inspection.
      # Polling reads KINDER_DATABASE_URL, never this inspection credential.
      - key: KINDER_INSPECTION_DATABASE_URL
        fromDatabase:
          name: kinder-spa-db
          property: connectionString
      - key: KINDER_DATABASE_NAME
        value: kinder_spa_db
      - key: KINDER_DATABASE_TRANSPORT
        value: render-private-tls
      - key: KINDER_DATABASE_SCHEMA
        value: kinder
