<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kinder Spa — сканер</title>
<link rel="stylesheet" href="/tg/static/scan.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="app">
  <header><b>Kinder Spa</b> · ресепшен</header>
  <section id="scan-box">
    <button id="scan-btn" class="big" type="button">📷 Сканировать QR</button>
    <details id="manual">
      <summary>Ввести код вручную</summary>
      <form id="manual-form"><input id="manual-code" placeholder="KSPA1:…" autocomplete="off"><button type="submit">Найти</button></form>
    </details>
  </section>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <section id="result"></section>
  <section id="today"><h2>Сегодня</h2><div id="today-list" class="muted">Загрузка…</div></section>
</main>
<script src="/tg/static/scan.js"></script>
</body>
</html>
