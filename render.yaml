# HISTORICAL UNFINISHED API SCAFFOLD: backend/Dockerfile is not yet implemented.
# Do not apply this file as a release. Render bot proposal: backend/deploy/render-telegram.yaml.
# Kinder Spa API blueprint. Existing paid PostgreSQL is managed separately.
# This blueprint does not create another database.
services:
  - type: web
    name: kinder-spa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kinder-spa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
